<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091726"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TradeTrack AI"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css"><style>.analysis-item{padding:7px 0;border-bottom:1px solid #edf1f6}.analysis-item:last-child{border:0}.analysis-item>small{display:block;margin-left:122px;color:#64748b;font-size:11px}.dashboard-filter{margin-bottom:12px}.calendar-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-controls button{border:0;border-radius:8px;background:#edf3f8;color:#24425d;font-size:22px;width:34px;height:30px}.calendar-week{word-spacing:14px;font-size:10px;color:#64748b;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;word-spacing:0;text-align:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}.cal-cell{min-height:48px;padding:4px;border-radius:7px;background:#f0f4f8;font-size:11px}.cal-cell b,.cal-cell small{display:block}.cal-cell small{font-size:9px;margin-top:3px}.profit-day{background:#d8f5e8;color:#07684f}.loss-day{background:#fde3e6;color:#a12b39}.empty-day{background:transparent}.equity-chart{width:100%;height:auto}.equity-chart line{stroke:#bac7d4;stroke-width:1}.equity-chart polyline{fill:none;stroke:#0b8f72;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.equity-chart text{fill:#52677b;font-size:10px}.trade-card button{background:#0b8f72;color:#fff;box-shadow:0 4px 10px #0b8f7230}.trade-card button:active,.primary:active{transform:scale(.97)}.photo-box input{background:#f7fbfa;border:1px dashed #9acabb;border-radius:10px;padding:9px}.metric{box-shadow:0 2px 10px #102a4310}</style><title>TradeTrack AI</title>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">↗</span><div><strong>TradeTrack AI</strong><small>Strategy journal</small></div></div><button id="exportBtn" class="icon-button" aria-label="Export backup">⇩</button></header>
  <main id="app" class="app-shell"></main>
  <nav class="bottom-nav" aria-label="Main navigation"><button data-route="dashboard">⌂<span>Dashboard</span></button><button data-route="new">＋<span>New trade</span></button><button data-route="history">☷<span>History</span></button><button data-route="analysis">⌁<span>Analysis</span></button></nav>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body></html>
